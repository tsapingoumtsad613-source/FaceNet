<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Souhaiter un joyeux anniversaire - FaceNet</title>
<style>
 *{box-sizing:border-box}
 body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:#0f1020;color:#fff;min-height:100vh}
 #confetti{position:fixed;inset:0;pointer-events:none;z-index:5}
 .wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px;position:relative;z-index:6}
 .top{display:flex;align-items:center;gap:8px;margin-bottom:14px}
 .top a{color:#fff;text-decoration:none;font-size:22px}
 .hero{text-align:center;margin:6px 0 18px}
 .hero .emoji{font-size:54px;animation:bounce 1.4s infinite}
 .hero h1{font-size:24px;margin:6px 0 2px}
 .hero p{margin:0;opacity:.8;font-size:14px}
 @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
 .styles{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
 .styles::-webkit-scrollbar{display:none}
 .chip{flex:0 0 auto;border:0;border-radius:20px;padding:9px 14px;font-size:14px;font-weight:600;color:#fff;background:rgba(255,255,255,.14);cursor:pointer}
 .chip.on{background:#fff;color:#111}
 .card{border-radius:20px;padding:22px 18px;margin:12px 0;min-height:170px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:background .4s}
 .card textarea{width:100%;min-height:130px;background:transparent;border:0;outline:0;color:#fff;font-size:17px;line-height:1.5;resize:vertical;font-family:inherit;text-shadow:0 1px 3px rgba(0,0,0,.35)}
 .actions{display:grid;gap:10px;margin-top:6px}
 .btn{border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;cursor:pointer}
 .btn.main{background:linear-gradient(135deg,#ff416c,#ff4b2b);color:#fff}
 .btn.alt{background:rgba(255,255,255,.15);color:#fff}
 .btn:disabled{opacity:.5}
 .note{text-align:center;font-size:13px;opacity:.8;margin-top:10px;min-height:18px}
 .done{background:rgba(49,162,76,.25);border-radius:14px;padding:12px;text-align:center;margin-bottom:10px}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="wrap">
  <div class="top"><a href="{{ url_for('anniv.anniversaires') }}">←</a><span>Anniversaires</span></div>

  <div class="hero">
    <div class="emoji">🎂</div>
    <h1>Souhaitez un joyeux anniversaire à {{ prenom }} !</h1>
    <p>{% if cest_aujourdhui %}C'est aujourd'hui{% if age %} — {{ age }} ans{% endif %} 🎉{% else %}Son anniversaire n'est pas aujourd'hui{% endif %}</p>
  </div>

  {% if deja %}<div class="done">✅ Vous lui avez déjà souhaité son anniversaire cette année.</div>{% endif %}

  <div class="styles" id="styles"></div>
  <div class="card" id="card"><textarea id="msg" maxlength="1500"></textarea></div>

  <div class="actions">
    <button class="btn main" id="btnPub" {% if deja %}disabled{% endif %}>🎉 Publier sur son fil</button>
    <button class="btn alt" id="btnShuffle">🎲 Un autre message</button>
    <button class="btn alt" id="btnCopy">📋 Copier le message</button>
  </div>
  <div class="note" id="note"></div>
</div>

<script>
const PRENOM = {{ prenom|tojson }};
const AGE = {{ age|tojson }};
const STYLES = [
 {id:'doux', nom:'💖 Doux', bg:'linear-gradient(135deg,#ff9a9e,#fad0c4 140%)', msgs:[
  "Joyeux anniversaire {p} ! 🎂 Que cette nouvelle année t'apporte joie, santé et réussite. Tu mérites tout le bonheur du monde ! 💖",
  "Pour toi {p}, une journée remplie de sourires et de gens qui t'aiment. Joyeux anniversaire ! 🌸"]},
 {id:'fete', nom:'🎉 Fête', bg:'linear-gradient(135deg,#f7971e,#ffd200 150%)', msgs:[
  "🎉🎂 HAPPY BIRTHDAY {p} !!! 🎂🎉 Aujourd'hui c'est TON jour : musique, gâteau, éclats de rire et zéro limite ! Profite à fond, tu es une légende ! 🔥",
  "🥳 {p} est de sortie ! Un an de plus, un an de mieux ! Que la fête commence 🎈🎶"]},
 {id:'classe', nom:'✨ Élégant', bg:'linear-gradient(135deg,#232526,#5f6b7a)', msgs:[
  "Cher(ère) {p}, en ce jour particulier, je te souhaite une année riche de belles rencontres et de grandes réussites. Joyeux anniversaire. ✨",
  "{p}, que chaque jour de cette nouvelle année soit à la hauteur de la personne remarquable que tu es. Joyeux anniversaire. 🥂"]},
 {id:'humour', nom:'😄 Humour', bg:'linear-gradient(135deg,#00c6ff,#0072ff)', msgs:[
  "{p}, un an de plus mais toujours aussi stylé(e) ! 😄 Les bougies coûtent plus cher que le gâteau, mais ça vaut le coup. Joyeux anniversaire ! 🕯️",
  "Joyeux anniversaire {p} ! Tu n'es pas vieux(vieille), tu es en édition limitée 😎🎁"]},
 {id:'amitie', nom:'🤝 Amitié', bg:'linear-gradient(135deg,#11998e,#38ef7d)', msgs:[
  "{p}, merci d'être un(e) ami(e) en or. Joyeux anniversaire, que la vie te rende tout ce que tu donnes aux autres ! 🤝💛",
  "Un ami comme toi {p}, ça ne s'oublie pas. Joyeux anniversaire, on fête ça bientôt ! 🎂🙌"]},
 {id:'benediction', nom:'🙏 Bénédiction', bg:'linear-gradient(135deg,#8e2de2,#4a00e0)', msgs:[
  "Joyeux anniversaire {p} ! 🙏 Que Dieu te bénisse, te garde et t'accorde santé, paix et prospérité cette année et toutes les suivantes.",
  "{p}, que cette nouvelle année soit remplie de grâce et de victoires. Bon anniversaire ! 🕊️✨"]}
];
let cur = STYLES[0], idx = 0;
const $ = id => document.getElementById(id);
const fill = t => t.replaceAll('{p}', PRENOM);

function show(){
  $('card').style.background = cur.bg;
  $('msg').value = fill(cur.msgs[idx % cur.msgs.length]);
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.id === cur.id));
}
STYLES.forEach(s => {
  const b = document.createElement('button');
  b.className = 'chip'; b.dataset.id = s.id; b.textContent = s.nom;
  b.onclick = () => { cur = s; idx = 0; show(); burst(); };
  $('styles').appendChild(b);
});
$('btnShuffle').onclick = () => { idx++; show(); };
$('btnCopy').onclick = async () => {
  try { await navigator.clipboard.writeText($('msg').value); $('note').textContent = 'Message copié ✅'; }
  catch(e){ $('msg').select(); document.execCommand('copy'); $('note').textContent = 'Message copié ✅'; }
};
$('btnPub').onclick = async () => {
  const contenu = $('msg').value.trim();
  if(!contenu){ $('note').textContent = 'Écrivez un message.'; return; }
  $('btnPub').disabled = true;
  try{
    const r = await fetch({{ url_for('anniv.publier_voeu', user_id=cible.id)|tojson }}, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({contenu})});
    const d = await r.json();
    $('note').textContent = d.message || '';
    if(d.status === 'success'){ burst(); burst(); setTimeout(() => location.href = d.url, 1600); }
    else if(d.status !== 'info'){ $('btnPub').disabled = false; }
  }catch(e){ $('note').textContent = 'Connexion impossible, réessayez.'; $('btnPub').disabled = false; }
};

/* Confettis */
const cv = $('confetti'), cx = cv.getContext('2d'); let parts = [];
function size(){ cv.width = innerWidth; cv.height = innerHeight; } size(); addEventListener('resize', size);
function burst(){
  const cols = ['#ff416c','#ffd200','#38ef7d','#00c6ff','#8e2de2','#fff'];
  for(let i=0;i<110;i++) parts.push({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*14,vy:Math.random()*-12-2,
    r:Math.random()*6+3,c:cols[i%cols.length],a:1,rot:Math.random()*6});
}
(function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts = parts.filter(p => p.a > 0.02);
  parts.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=.35; p.a-=.011; p.rot+=.2;
    cx.save(); cx.globalAlpha=Math.max(p.a,0); cx.translate(p.x,p.y); cx.rotate(p.rot);
    cx.fillStyle=p.c; cx.fillRect(-p.r,-p.r/2,p.r*2,p.r); cx.restore(); });
  requestAnimationFrame(loop);
})();
show(); if({{ 'true' if cest_aujourdhui else 'false' }}) setTimeout(burst, 400);
</script>
</body>
</html>
