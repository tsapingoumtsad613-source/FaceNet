<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ fete_nom }} - FaceNet</title>
<style>
 *{box-sizing:border-box}
 :root{--a:{{ '#c62828' if fete_type == 'noel' else '#f9a825' }};--b:{{ '#1b5e20' if fete_type == 'noel' else '#4a148c' }}}
 body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:linear-gradient(160deg,var(--b),#0f1020 70%);color:#fff;min-height:100vh}
 #confetti{position:fixed;inset:0;pointer-events:none;z-index:5}
 .wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px;position:relative;z-index:6}
 .top{display:flex;align-items:center;gap:8px;margin-bottom:14px}
 .top a{color:#fff;text-decoration:none;font-size:22px}
 .hero{text-align:center;margin:6px 0 18px}
 .hero .emoji{font-size:58px;animation:bounce 1.4s infinite}
 .hero h1{font-size:23px;margin:6px 0 2px}
 .hero p{margin:0;opacity:.85;font-size:14px}
 @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
 h3{font-size:15px;margin:18px 0 8px;opacity:.9}
 .search{width:100%;padding:12px 14px;border-radius:12px;border:0;font-size:15px;background:rgba(255,255,255,.15);color:#fff;outline:0}
 .search::placeholder{color:rgba(255,255,255,.7)}
 .friends{max-height:230px;overflow-y:auto;margin-top:8px;border-radius:14px;background:rgba(255,255,255,.08)}
 .friend{display:flex;align-items:center;gap:12px;padding:10px 12px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.08)}
 .friend img{width:42px;height:42px;border-radius:50%;object-fit:cover}
 .friend.on{background:rgba(255,255,255,.25)}
 .friend .n{flex:1;font-weight:600}
 .empty{padding:16px;text-align:center;opacity:.8;font-size:14px}
 .styles{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
 .styles::-webkit-scrollbar{display:none}
 .chip{flex:0 0 auto;border:0;border-radius:20px;padding:9px 14px;font-size:14px;font-weight:600;color:#fff;background:rgba(255,255,255,.14);cursor:pointer}
 .chip.on{background:#fff;color:#111}
 .card{border-radius:20px;padding:20px 18px;margin:12px 0;min-height:160px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.35);background:linear-gradient(135deg,var(--a),var(--b))}
 .card textarea{width:100%;min-height:120px;background:transparent;border:0;outline:0;color:#fff;font-size:17px;line-height:1.5;resize:vertical;font-family:inherit;text-shadow:0 1px 3px rgba(0,0,0,.35)}
 .actions{display:grid;gap:10px;margin-top:6px}
 .btn{border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;color:#fff}
 .btn.main{background:linear-gradient(135deg,var(--a),#ff7043)}
 .btn.alt{background:rgba(255,255,255,.15)}
 .btn:disabled{opacity:.5}
 .note{text-align:center;font-size:14px;margin-top:10px;min-height:18px}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="wrap">
  <div class="top"><a href="{{ url_for('main.notifications') }}">←</a><span>Notifications</span></div>

  <div class="hero">
    <div class="emoji">{{ fete_emoji }}</div>
    <h1>{{ fete_titre }}</h1>
    <p>Choisissez un ami, un message, et publiez-le sur son fil.</p>
  </div>

  <h3>1. À qui souhaitez-vous le message ?</h3>
  <input class="search" id="q" placeholder="Rechercher un ami…" autocomplete="off">
  <div class="friends" id="friends"><div class="empty">Chargement de vos amis…</div></div>

  <h3>2. Votre message</h3>
  <div class="styles" id="styles"></div>
  <div class="card"><textarea id="msg" maxlength="1500"></textarea></div>

  <div class="actions">
    <button class="btn main" id="btnPub" disabled>{{ fete_emoji }} Publier sur son fil</button>
    <button class="btn alt" id="btnShuffle">🎲 Un autre message</button>
  </div>
  <div class="note" id="note"></div>
</div>

<script>
const FETE = {{ fete_type|tojson }};
const PRE_AMI = {{ ami_id|tojson }};
const STYLES = FETE === 'noel' ? [
 {nom:'🙏 Respectueux', msgs:[
  "Cher(ère) {p}, je vous souhaite un très Joyeux Noël. Que cette fête vous apporte paix, joie et santé auprès des vôtres. 🎄",
  "{p}, en cette belle fête de Noël, recevez mes meilleurs vœux de bonheur et de sérénité. Joyeux Noël ! 🌟"]},
 {nom:'💖 Chaleureux', msgs:[
  "Joyeux Noël {p} ! 🎅 Que cette fête soit remplie d'amour, de rires et de belles surprises. Je pense bien à toi ! 💖",
  "Pour toi {p}, un Noël lumineux, plein de tendresse et de moments inoubliables. Joyeux Noël ! ❄️"]},
 {nom:'🤝 Amitié', msgs:[
  "{p}, merci d'être un(e) ami(e) en or. Joyeux Noël, que la vie te rende tout ce que tu donnes aux autres ! 🎁",
  "Un(e) ami(e) comme toi {p}, c'est un vrai cadeau. Joyeux Noël et à très bientôt ! 🎄🤝"]},
 {nom:'🕊️ Bénédiction', msgs:[
  "Joyeux Noël {p} ! Que le Seigneur te bénisse, te garde et t'accorde grâce, paix et prospérité. 🙏✨",
  "{p}, que la joie de la naissance du Sauveur remplisse ton cœur et ta maison. Joyeux Noël ! 🕊️"]}
] : [
 {nom:'🙏 Respectueux', msgs:[
  "Cher(ère) {p}, je vous présente mes meilleurs vœux pour la nouvelle année : santé, bonheur et réussite. Bonne année ! 🎆",
  "{p}, que cette nouvelle année vous apporte sérénité et accomplissement dans tous vos projets. Bonne et heureuse année ! ✨"]},
 {nom:'💖 Chaleureux', msgs:[
  "Bonne année {p} ! 🎉 Que cette année t'apporte santé, amour et plein de belles aventures. Je t'embrasse ! 💖",
  "{p}, que chaque jour de cette nouvelle année soit une source de joie pour toi. Bonne année ! 🥂"]},
 {nom:'🤝 Amitié', msgs:[
  "{p}, merci pour ton amitié tout au long de l'année. Que la suivante nous réunisse encore plus. Bonne année ! 🤝🎆",
  "Bonne année {p} ! Que tous tes rêves se réalisent et que notre amitié dure toujours. 🎇"]},
 {nom:'🕊️ Bénédiction', msgs:[
  "Bonne année {p} ! Que Dieu te garde, te bénisse et dirige chacun de tes pas durant cette nouvelle année. 🙏✨",
  "{p}, que cette année soit remplie de grâce, de paix et de victoires. Bonne et heureuse année ! 🕊️"]}
];
let cur = STYLES[0], idx = 0, ami = null, amis = [];
const $ = id => document.getElementById(id);
const prenom = a => (a && (a.nom_complet || '').split(' ')[0]) || 'cher ami';
const avatar = a => '/static/uploads/' + (a.avatar || 'default_avatar.png');

function show(){
  $('msg').value = cur.msgs[idx % cur.msgs.length].replaceAll('{p}', prenom(ami));
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.n === cur.nom));
}
STYLES.forEach(s => {
  const b = document.createElement('button');
  b.className = 'chip'; b.dataset.n = s.nom; b.textContent = s.nom;
  b.onclick = () => { cur = s; idx = 0; show(); burst(); };
  $('styles').appendChild(b);
});
$('btnShuffle').onclick = () => { idx++; show(); };

function drawFriends(){
  const q = $('q').value.trim().toLowerCase();
  const liste = amis.filter(a => (a.nom_complet || '').toLowerCase().includes(q));
  const box = $('friends'); box.innerHTML = '';
  if(!liste.length){ box.innerHTML = '<div class="empty">Aucun ami trouvé.</div>'; return; }
  liste.forEach(a => {
    const d = document.createElement('div');
    d.className = 'friend' + (ami && ami.id === a.id ? ' on' : '');
    const img = document.createElement('img'); img.src = avatar(a); img.alt = '';
    const n = document.createElement('span'); n.className = 'n'; n.textContent = a.nom_complet;
    d.append(img, n);
    d.onclick = () => { ami = a; $('btnPub').disabled = false; drawFriends(); show(); };
    box.appendChild(d);
  });
}
$('q').oninput = drawFriends;
fetch('/api/amis', {credentials:'same-origin'}).then(r => r.json()).then(d => {
  amis = d.amis || [];
  if(PRE_AMI){ ami = amis.find(a => a.id === PRE_AMI) || null; if(ami) $('btnPub').disabled = false; }
  drawFriends(); show();
}).catch(() => { $('friends').innerHTML = '<div class="empty">Impossible de charger vos amis.</div>'; });

$('btnPub').onclick = async () => {
  const contenu = $('msg').value.trim();
  if(!ami){ $('note').textContent = 'Choisissez un ami.'; return; }
  if(!contenu){ $('note').textContent = 'Écrivez un message.'; return; }
  $('btnPub').disabled = true;
  try{
    const r = await fetch('/api/voeux-fetes/publier', {method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({type: FETE, destinataire_id: ami.id, contenu})});
    const d = await r.json();
    $('note').textContent = d.message || d.error || '';
    if(d.success){ burst(); burst(); setTimeout(() => location.href = d.url, 1600); }
    else { $('btnPub').disabled = false; }
  }catch(e){ $('note').textContent = 'Connexion impossible, réessayez.'; $('btnPub').disabled = false; }
};

/* Confettis */
const cv = $('confetti'), cx = cv.getContext('2d'); let parts = [];
function size(){ cv.width = innerWidth; cv.height = innerHeight; } size(); addEventListener('resize', size);
function burst(){
  const cols = FETE === 'noel' ? ['#c62828','#2e7d32','#fff','#ffd54f'] : ['#ffd54f','#ff7043','#7e57c2','#fff','#26c6da'];
  for(let i=0;i<110;i++) parts.push({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*14,vy:Math.random()*-12-2,
    r:Math.random()*6+3,c:cols[i%cols.length],a:1,rot:Math.random()*6});
}
(function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts = parts.filter(p => p.a > 0.02);
  parts.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=.35; p.a-=.011; p.rot+=.2;
    cx.save(); cx.globalAlpha=Math.max(p.a,0); cx.translate(p.x,p.y); cx.rotate(p.rot);
    cx.fillStyle=p.c; cx.fillRect(-p.r,-p.r/2,p.r*2,p.r); cx.restore(); });
  requestAnimationFrame(loop);
})();
setTimeout(burst, 400);
</script>
</body>
</html>
