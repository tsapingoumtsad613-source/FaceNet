{% extends "base.html" %}

{% block head %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
        :root {
            --fn-blue: #0866FF;
            --fn-light-blue: #E7F3FF;
            --fn-bg: #F0F2F5;
            --fn-gray: #65676B;
            --fn-border: #E4E6EB;
            --white: #ffffff;
            --text-dark: #1C1E21;
            --gradient-brand: linear-gradient(135deg, #0866FF 0%, #0045B5 100%);
        }

        .signup-container, .signup-container * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        .signup-page-wrapper {
            background: var(--fn-bg);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - var(--header-h, 60px) - var(--nav-h, 60px));
            padding: 20px;
        }

        .signup-container {
            width: 100%;
            max-width: 450px;
            background: var(--white);
            border-radius: 16px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
            padding: 30px 24px;
            text-align: center;
            animation: slideUp 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .brand-logo {
            font-size: 32px;
            font-weight: 850;
            background: var(--gradient-brand);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .brand-subtitle {
            font-size: 15px;
            color: var(--fn-gray);
            margin-bottom: 28px;
            font-weight: 500;
        }

        /* --- PREVIEW DE L'AVATAR --- */
        .avatar-upload-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 24px;
        }

        .avatar-preview {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid var(--fn-blue);
            object-fit: cover;
            background: #F0F2F5;
        }

        .avatar-edit-badge {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background: var(--fn-blue);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        .avatar-edit-badge:hover {
            transform: scale(1.1);
        }

        #avatarFile {
            display: none;
        }

        /* --- FORMULAIRE STYLE PREMIUM --- */
        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            color: var(--fn-gray);
            font-size: 16px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 13px 16px 13px 46px;
            border-radius: 10px;
            border: 1.5px solid var(--fn-border);
            background: #F8F9FA;
            font-size: 15px;
            font-weight: 500;
            outline: none;
            transition: all 0.25s ease;
        }

        .input-wrapper input:focus {
            background: var(--white);
            border-color: var(--fn-blue);
            box-shadow: 0 0 0 4px rgba(8, 102, 255, 0.12);
        }

        /* --- BOUTON PRINCIPAL --- */
        .btn-signup {
            width: 100%;
            padding: 14px;
            background: var(--gradient-brand);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(8, 102, 255, 0.2);
            transition: all 0.2s ease;
        }

        .btn-signup:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(8, 102, 255, 0.3);
        }

        .btn-signup:active {
            transform: translateY(1px);
        }

        /* --- SÉPARATEUR & LIEN DE CONNEXION --- */
        .separator {
            margin: 22px 0;
            border-top: 1px solid var(--fn-border);
            position: relative;
        }

        .login-link {
            font-size: 14px;
            color: var(--fn-gray);
            font-weight: 500;
        }

        .login-link a {
            color: var(--fn-blue);
            text-decoration: none;
            font-weight: 700;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
{% endblock %}

{% block content %}

<div class="signup-page-wrapper">
<div class="signup-container">
    <div class="brand-logo">FaceNet</div>
    <div class="brand-subtitle">Créez votre profil pour rejoindre Messenger</div>

    <!-- Formulaire Flask lié à ta route d'inscription d'authentification -->
    <form action="{{ url_for('main.signup') }}" method="POST" enctype="multipart/form-data">
        
        <!-- Section Choix de l'Avatar -->
        <div class="avatar-upload-container">
            <img src="https://via.placeholder.com/150" id="avatarImgPreview" class="avatar-preview" alt="Prévisualisation">
            <label for="avatarFile" class="avatar-edit-badge">
                <i class="fas fa-camera"></i>
            </label>
            <input type="file" id="avatarFile" name="avatar" accept="image/*" onchange="previewImage(event)">
        </div>

        <!-- Nom Complet -->
        <div class="form-group">
            <label>Nom Complet</label>
            <div class="input-wrapper">
                <i class="fas fa-user"></i>
                <input type="text" name="nom_complet" placeholder="Entrez votre nom complet" required autocomplete="name">
            </div>
        </div>

        <!-- Nom d'utilisateur / Identifiant -->
        <div class="form-group">
            <label>Nom d'utilisateur</label>
            <div class="input-wrapper">
                <i class="fas fa-at"></i>
                <input type="text" name="username" placeholder="Choisissez un nom d'utilisateur" required autocomplete="username">
            </div>
        </div>

        <!-- Adresse Email -->
        <div class="form-group">
            <label>Adresse Émail</label>
            <div class="input-wrapper">
                <i class="fas fa-envelope"></i>
                <input type="email" name="email" placeholder="Entrez votre adresse émail" required autocomplete="email">
            </div>
        </div>

        <!-- Mot de passe -->
        <div class="form-group">
            <label>Mot de passe</label>
            <div class="input-wrapper">
                <i class="fas fa-lock"></i>
                <input type="password" name="password" placeholder="Créez votre mot de passe" required autocomplete="new-password">
            </div>
        </div>

        <!-- Bouton de validation -->
        <button type="submit" class="btn-signup">Créer mon compte</button>
    </form>

    <div class="separator"></div>

    <div class="login-link">
        Vous avez déjà un compte ? <a href="{{ url_for('main.login') }}">Se connecter</a>
    </div>
</div>
</div>

<script>
    // Prévisualisation de l'image de l'avatar au chargement
    function previewImage(event) {
        const reader = new FileReader();
        reader.onload = function() {
            const output = document.getElementById('avatarImgPreview');
            output.src = reader.result;
        };
        reader.readAsDataURL(event.target.files[0]);
    }
</script>
{% endblock %}
