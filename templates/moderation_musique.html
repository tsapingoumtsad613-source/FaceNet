<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Musiques signalées</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f0f2f5;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#1c1e21}
    header{background:#fff;border-bottom:1px solid #dadde1;padding:14px 16px}
    header h1{margin:0;font-size:1.2rem}
    nav{display:flex;gap:8px;margin-top:10px}
    nav a{padding:7px 14px;border-radius:18px;background:#e4e6eb;color:#1c1e21;text-decoration:none;font-size:.9rem}
    nav a.on{background:#1877f2;color:#fff}
    main{max-width:720px;margin:0 auto;padding:14px}
    .card{background:#fff;border-radius:10px;padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.12);display:flex;justify-content:space-between;align-items:center;gap:10px}
    .titre{font-weight:600;overflow-wrap:anywhere}
    .art{color:#65676b;font-size:.9rem;margin-top:2px}
    .nb{flex-shrink:0;padding:4px 12px;border-radius:14px;background:#e4e6eb;font-weight:700}
    .nb.fort{background:#fdecea;color:#c0392b}
    .empty{text-align:center;color:#65676b;padding:40px 0}
  </style>
</head>
<body>
<header>
  <h1>Musiques signalées</h1>
  <nav>
    <a href="/moderation/signalements">Signalements</a>
    <a href="/moderation/musiques" class="on">Musiques</a>
  </nav>
</header>
<main>
  {% for l in lignes %}
  <div class="card">
    <div>
      <div class="titre">{{ l.titre }}</div>
      {% if l.artiste %}<div class="art">{{ l.artiste }}</div>{% endif %}
    </div>
    <span class="nb {{ 'fort' if l.nb >= 3 }}">{{ l.nb }} signalement{{ 's' if l.nb > 1 }}</span>
  </div>
  {% else %}
  <p class="empty">Aucune musique signalée pour le moment.</p>
  {% endfor %}
</main>
</body>
</html>
