.st-menu{position:absolute;right:14px;top:14%;display:flex;flex-direction:column;align-items:flex-end;gap:6px}

.st-menu button i{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 1px 3px rgba(0,0,0,.55));transition:background .2s,color .2s}

.st-plus svg{width:22px;height:22px}

.st-speed{position:absolute;left:50%;transform:translateX(-50%);bottom:156px;display:none;background:rgba(30,30,30,.62);border-radius:20px;padding:3px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

.st-speed button{background:none;border:none;color:#fff;font-size:14px;font-weight:700;padding:8px 14px;border-radius:17px;cursor:pointer}
.st-speed button.sel{background:#fff;color:#111}

.st-bottom{position:absolute;left:0;right:0;bottom:78px;height:66px}
.st-recwrap{position:absolute;left:50%;top:0;width:66px;height:66px;transform:translateX(-50%)}
.st-ring{position:absolute;inset:0;border-radius:50%;background:rgba(255,255,255,.28);transition:background .2s}
.st-rec{position:absolute;inset:8px;border-radius:50%;background:#fff;border:none;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.st-rec:active{transform:scale(.92)}
.st-rec svg{width:26px;height:26px}
.st-rec .st-sq{width:20px;height:20px;border-radius:6px;background:#e4243c}
.st-pause{position:absolute;left:calc(50% - 40px - 46px);top:10px;width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.85);background:rgba(0,0,0,.45);color:#fff;display:none;align-items:center;justify-content:center;cursor:pointer;padding:0}

.st-pause svg{width:20px;height:20px}
.st-strip{position:absolute;left:calc(50% + 46px);right:0;top:50%;transform:translateY(-50%);height:60px;display:none;align-items:center;gap:12px;overflow-x:auto;padding:0 14px 0 4px;scrollbar-width:none}
.st-strip.on{display:flex}
.st-strip::-webkit-scrollbar{display:none}
.st-gal{position:absolute;left:12px;bottom:12px}
.st-flip{position:absolute;right:12px;bottom:12px}
#rr-studio.enreg .st-gal,#rr-studio.enreg .st-flip,#rr-studio.enreg .st-menu,#rr-studio.enreg .st-strip,#rr-studio.enreg .st-plus,#rr-studio.enreg .st-speed,#rr-studio.enreg #st-more{display:none!important}

.st-th{flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:none;padding:0;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4),inset 0 0 0 1.5px rgba(255,255,255,.35);transition:transform .15s,box-shadow .15s}

.st-th.sel{transform:scale(1.14);box-shadow:0 0 0 3px #fff,0 3px 12px rgba(0,0,0,.5)}
.st-th.aucun{background:rgba(30,30,30,.6)}

.st-count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:110px;font-weight:800;text-shadow:0 4px 24px rgba(0,0,0,.6);pointer-events:none}
.st-count.on{display:flex}
.st-label{position:absolute;left:50%;top:36%;transform:translateX(-50%);padding:7px 16px;background:rgba(0,0,0,.5);border-radius:18px;font-weight:700;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.st-label.on{opacity:1}
.st-msg{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:0 34px;font-size:14px;line-height:1.45;background:rgba(0,0,0,.55)}

.st-msg button{background:#1877f2;color:#fff;border:none;border-radius:20px;padding:10px 22px;font-weight:700;font-size:14px;cursor:pointer}

.st-pop{position:absolute;top:56px;right:10px;width:250px;background:#fff;color:#050505;border-radius:14px;padding:6px 0;box-shadow:0 10px 30px rgba(0,0,0,.4);display:none;z-index:6}

.st-tabs button.sel{color:#1877f2}
.st-tabs button.sel::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;background:#1877f2}

.st-cell{position:relative;aspect-ratio:3/4;border:none;padding:0;background:#f0f2f5;cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#050505}

.st-cell svg{width:42px;height:42px}
.st-cell .nom{position:absolute;left:0;right:0;bottom:0;padding:14px 4px 4px;font-size:10.5px;font-weight:700;color:#fff;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.55));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-cell.ajout{flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:#1877f2}
.st-cell.ajout svg{width:34px;height:34px}
.st-vide{grid-column:1/-1;padding:40px 24px;text-align:center;color:#65676b;font-size:14px;line-height:1.45}
.st-vide svg{width:40px;height:40px;margin:0 auto 12px;color:#bcc0c4}
.st-vide button{margin-top:14px;background:#1877f2;color:#fff;border:none;border-radius:20px;padding:10px 20px;font-weight:700;font-size:14px;cursor:pointer}
.st-chips{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 10px;flex-shrink:0;scrollbar-width:none}
.st-chips::-webkit-scrollbar{display:none}
.st-chips button{flex:0 0 auto;background:#f0f2f5;border:none;border-radius:16px;padding:8px 15px;font-size:13px;font-weight:700;color:#050505;cursor:pointer}
.st-chips button.sel{background:#1877f2;color:#fff}

.st-fxgrid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px;padding:6px 10px 20px;align-content:start}
.st-fxitem{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;padding:0;cursor:pointer;color:#050505}

.st-bd{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:4;display:none}
.st-bd.on{display:block}

  if(o.con!=null){const c=o.con,b=.5-.5*c;m=mul([[c,0,0,b],[0,c,0,b],[0,0,c,b]],m)}
  if(o.bri!=null){const b=o.bri;m=mul([[b,0,0,0],[0,b,0,0],[0,0,b,0]],m)}
  if(o.off){m=mul([[1,0,0,o.off[0]],[0,1,0,o.off[1]],[0,0,1,o.off[2]]],m)}

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function lg(c,x0,y0,x1,y1,st){const g=c.createLinearGradient(x0,y0,x1,y1);st.forEach(s=>g.addColorStop(s[0],s[1]));return g}
function rg(c,x,y,r0,r1,st){const g=c.createRadialGradient(x,y,r0,x,y,r1);st.forEach(s=>g.addColorStop(s[0],s[1]));return g}
function etoiles(c,w,h,r,n,ymax){for(let i=0;i<n;i++){const x=r()*w,y=r()*h*(ymax||1),s=r()*1.4+.3;c.globalAlpha=.4+r()*.6;c.fillStyle='#fff';c.beginPath();c.arc(x,y,s,0,6.283);c.fill()}c.globalAlpha=1}
function nuage(c,x,y,s,a){c.fillStyle='rgba(255,255,255,'+a+')';[[0,0,1],[.9,.25,.8],[-.9,.25,.75],[.35,-.3,.8],[-.4,-.15,.7]].forEach(p=>{c.beginPath();c.ellipse(x+p[0]*s,y+p[1]*s*.6,s*p[2],s*.5*p[2],0,0,6.283);c.fill()})}
function crete(c,w,h,y0,amp,fr,ph,col,r){c.fillStyle=col;c.beginPath();c.moveTo(0,h);for(let x=0;x<=w;x+=6)c.lineTo(x,y0+Math.sin(x*fr+ph)*amp+Math.sin(x*fr*2.3+ph*1.7)*amp*.45);c.lineTo(w,h);c.closePath();c.fill()}
function sapin(c,x,y,s,col,neige){c.fillStyle=col;for(let i=0;i<3;i++){const yy=y-i*s*.55,ww=s*(1-i*.22);c.beginPath();c.moveTo(x,yy-s*.9);c.lineTo(x-ww*.55,yy);c.lineTo(x+ww*.55,yy);c.closePath();c.fill()}if(neige){c.fillStyle='rgba(255,255,255,.85)';c.beginPath();c.moveTo(x,y-s*2);c.lineTo(x-s*.18,y-s*1.6);c.lineTo(x+s*.18,y-s*1.6);c.closePath();c.fill()}}

    c.globalAlpha=Math.sin(Math.min(1,ph*1.15)*Math.PI)*.95;c.shadowColor='rgba(120,200,255,.95)';c.shadowBlur=fw*.04;c.fillStyle='#d8f1ff';
    placer(c,p,f.roll,function(){c.beginPath();c.moveTo(0,-fw*.03);c.quadraticCurveTo(fw*.03,fw*.0,0,fw*.03);c.quadraticCurveTo(-fw*.03,fw*.0,0,-fw*.03);c.fill();pSpark(c,fw*.025)})}});
  c.globalAlpha=1;c.shadowBlur=0;
};
D.arcenciel=function(c,k,f){
  const fw=f.fw,cols=['#ff4d6d','#ffb347','#ffe14d','#4dd2ff'];
  c.lineCap='round';
  [[k.cL,-1],[k.cR,1]].forEach(function(z){
    cols.forEach(function(col,i){c.strokeStyle=col;c.globalAlpha=.85;c.lineWidth=fw*.02;
      placer(c,z[0],f.roll,function(){c.beginPath();c.arc(0,-fw*.03,fw*(.06+i*.028),Math.PI*.15,Math.PI*.85);c.stroke()})});
    c.globalAlpha=1;c.fillStyle='#ffe14d';placer(c,f.L(z[0],z[1]*.07,.14),f.roll,function(){pStar(c,fw*.05)});
  });
  c.globalAlpha=1;
};
D.etincelles=function(c,k,f){
  const fw=f.fw,ctr=milieu(k.top,k.chin,.5);
  for(let i=0;i<10;i++){const a=f.t*.8+i*.628,tw=.5+.5*Math.sin(f.t*5+i*1.7),p={x:ctr.x+Math.cos(a)*fw*.78,y:ctr.y+Math.sin(a)*fw*.92};
    c.globalAlpha=.35+.65*tw;c.shadowColor='rgba(255,225,120,.95)';c.shadowBlur=fw*.05;c.fillStyle=i%2?'#fff6c2':'#ffd54a';
    placer(c,p,a,function(){pSpark(c,fw*(.035+.04*tw))})}
  c.globalAlpha=1;c.shadowBlur=0;
};
D.masque=function(c,k,f){
  const fw=f.fw,mid=milieu(k.eyeL,k.eyeR,.5),dist=Math.hypot(k.eyeR.x-k.eyeL.x,k.eyeR.y-k.eyeL.y);
  placer(c,mid,f.roll,function(){
    const w=dist/2+fw*.24,h=fw*.17,g=c.createLinearGradient(-w,0,w,0);g.addColorStop(0,'#2a0a4a');g.addColorStop(.5,'#6a2cc0');g.addColorStop(1,'#2a0a4a');
    c.fillStyle=g;c.beginPath();c.moveTo(-w,-h*.2);c.bezierCurveTo(-w*.7,-h*1.1,-w*.2,-h*.8,0,-h*.45);c.bezierCurveTo(w*.2,-h*.8,w*.7,-h*1.1,w,-h*.2);
    c.bezierCurveTo(w*1.02,h*.7,w*.7,h*1.1,w*.45,h*.95);c.bezierCurveTo(w*.25,h*.85,w*.15,h*.4,0,h*.4);c.bezierCurveTo(-w*.15,h*.4,-w*.25,h*.85,-w*.45,h*.95);c.bezierCurveTo(-w*.7,h*1.1,-w*1.02,h*.7,-w,-h*.2);c.closePath();
    [-1,1].forEach(function(s){c.moveTo(s*dist/2+fw*.12,0);c.ellipse(s*dist/2,0,fw*.12,fw*.07,0,0,6.283)});
    c.fill('evenodd');
    c.fillStyle='rgba(255,255,255,.75)';[-.7,-.45,.45,.7].forEach(function(x){ellipse(c,x*w,-h*.55,fw*.012,fw*.012,'rgba(255,255,255,.8)')});
  });
};
D.noel=function(c,k,f){
  const fw=f.fw;
  placer(c,f.L(k.chin,0,.0),f.roll,function(){
    c.scale(.78,.84);c.fillStyle='#fff';c.shadowColor='rgba(0,0,0,.25)';c.shadowBlur=fw*.03;
    c.beginPath();c.moveTo(-fw*.52,-fw*.36);c.bezierCurveTo(-fw*.66,fw*.05,-fw*.38,fw*.36,0,fw*.42);c.bezierCurveTo(fw*.38,fw*.36,fw*.66,fw*.05,fw*.52,-fw*.36);
    c.quadraticCurveTo(fw*.34,-fw*.2,fw*.16,-fw*.24);c.quadraticCurveTo(0,-fw*.13,-fw*.16,-fw*.24);c.quadraticCurveTo(-fw*.34,-fw*.2,-fw*.52,-fw*.36);c.closePath();c.fill();
    c.shadowBlur=0;c.strokeStyle='rgba(180,190,210,.6)';c.lineWidth=fw*.01;[-.3,0,.3].forEach(function(x){c.beginPath();c.moveTo(x*fw,fw*.05);c.quadraticCurveTo(x*fw+fw*.04,fw*.18,x*fw,fw*.3);c.stroke()});
  });
  placer(c,f.L(k.top,0,-.05),f.roll,function(){
    const g=c.createLinearGradient(0,-fw*.6,0,0);g.addColorStop(0,'#ff4a4a');g.addColorStop(1,'#b3101c');
    c.fillStyle=g;c.beginPath();c.moveTo(-fw*.52,0);c.quadraticCurveTo(-fw*.4,-fw*.5,fw*.28,-fw*.58);c.quadraticCurveTo(fw*.42,-fw*.5,fw*.4,-fw*.4);c.quadraticCurveTo(fw*.5,-fw*.2,fw*.52,0);c.closePath();c.fill();
    c.fillStyle='#fff';c.shadowColor='rgba(0,0,0,.25)';c.shadowBlur=fw*.02;c.beginPath();c.rect(-fw*.56,-fw*.04,fw*1.12,fw*.13);c.fill();
    ellipse(c,fw*.38,-fw*.44,fw*.085,fw*.085,'#fff');
  });
};
function dessinerVisage(c,e,time){
  if(!e.face||!visageVisible())return;
  const fn=D[e.face];if(!fn)return;
  c.save();c.globalAlpha=1;c.globalCompositeOperation='source-over';c.shadowBlur=0;c.lineCap='round';
  try{fn(c,S.faceS,repere(S.faceS,time))}catch(err){}
  c.restore();
}
function calcBulge(e,time){
  const b=S.bul;b.s=0;
  if(!e||!e.bulge||!visageVisible())return;
  const k=S.faceS,f=repere(k,time),g=e.bulge;
  let pts;
  if(g.pts==='eyes')pts=[k.eyeL,k.eyeR];else if(g.pts==='nose')pts=[k.nose];else pts=[milieu(k.mu,k.ml,.5)];
  b.x1=pts[0].x/W;b.y1=1-pts[0].y/H;
  if(pts[1]){b.x2=pts[1].x/W;b.y2=1-pts[1].y/H}else{b.x2=-5;b.y2=-5}
  b.r=f.fw*g.rad/H;b.s=g.str;
}

function majPanneaux(){
  const fx=S.panneau==='effets',sp=S.panneau==='vitesse';
  R.strip.classList.toggle('on',fx);R.plus.classList.toggle('on',fx);R.speed.classList.toggle('on',sp);
  R['btn-effets'].classList.toggle('on',fx);root.classList.toggle('fx-on',fx);
  R['ico-effets'].innerHTML=fx?IC.logo:IC.sparkles;
  R['lab-vitesse'].textContent=S.speed===1?'Vitesse':'Vitesse '+S.speed+'x';
  if(fx){const s=$('.st-th.sel',R.strip);if(s)s.scrollIntoView({inline:'center',block:'nearest'})}
}
function effacerFondVert(){
  S.fvBg=null;S.fvBgPrev=null;S.maskReady=false;S.segBusy=false;
  (S.pellicule||[]).forEach(it=>{if(it.video&&it.el){try{it.el.pause()}catch(e){}}});
  try{majPanneaux()}catch(e){}
}
let segCv=null;
/* Découpage de la personne : image réduite + cadence adaptée → la caméra reste fluide, la voix aussi */
function envoyerSeg(v){
  const now=performance.now();
  if(S.segBusy){if(now-S.segT>1500)S.segBusy=false;else return}
  if(now-S.segT<S.segGap)return;
  S.segBusy=true;S.segT=now;
  try{
    if(!segCv)segCv=document.createElement('canvas');
    const sw=288,sh=Math.max(2,Math.round(sw*v.videoHeight/v.videoWidth));
    if(segCv.width!==sw||segCv.height!==sh){segCv.width=sw;segCv.height=sh}
    segCv.getContext('2d').drawImage(v,0,0,sw,sh);
  }catch(e){S.segBusy=false;return}
  S.seg.send({image:segCv}).then(()=>{S.segGap=Math.min(400,Math.max(80,(performance.now()-now)*1.3));S.segBusy=false}).catch(()=>{S.segBusy=false});
}
function basculerPanneau(p){S.panneau=S.panneau===p?null:p;R.pop.classList.remove('on');if(S.panneau==='effets'&&S.fvBg){effacerFondVert();toast('Fond vert retiré')}majPanneaux()}

  [0.5,1,2,3].forEach(v=>{const b=el('button',v===S.speed?'sel':'',v+'x');b.dataset.v=v;b.onclick=()=>{S.speed=v;R.speed.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',+x.dataset.v===v));majPanneaux();toast(v===1?'Vitesse normale':'Vitesse '+v+'x')};R.speed.appendChild(b)});
}
function thumb(e,cls){

function appliquerEffet(id){

function ouvrirFV(){
  if(S.rec)return;
  try{chargerSeg().catch(()=>{})}catch(e){} /* précharge le découpage pendant que l'utilisateur choisit */
  S.fv=true;S.fvBgPrev=S.fvBg;S.panneau=null;majPanneaux();R.pop.classList.remove('on');
  root.classList.add('fv');layout();
  construireFV();R.fvsheet.classList.add('on');
}
function fermerFV(){
  S.fv=false;root.classList.remove('fv');R.fvsheet.classList.remove('on');R.bd.classList.remove('on');layout();majPanneaux();
}
function genererScenes(){
  if(S.scenesPretes)return;S.scenesPretes=true;
  SCENES.forEach((sc,i)=>{
    const c=document.createElement('canvas');c.width=360;c.height=640;
    try{sc.draw(c.getContext('2d'),360,640,mulberry(1000+i*77))}catch(e){console.warn('[studio] scène',sc.id,e)}
    sc.cv=c;
    try{sc.thumb=c.toDataURL('image/jpeg',.72)}catch(e){sc.thumb=''}
  });
}
function construireFV(){
  const g=R.fvgrid;g.innerHTML='';
  const tab=S.tabFV;
  R.fvsheet.querySelectorAll('.st-tabs button').forEach(b=>b.classList.toggle('sel',b.dataset.t===tab));
  const aucun=el('button','st-cell'+(!S.fvBg?' sel':''),IC.ban);aucun.setAttribute('aria-label','Aucun fond');
  aucun.onclick=()=>choisirFond(null);
  if(tab==='scenes'){
    genererScenes();g.appendChild(aucun);
    SCENES.forEach(sc=>{
      const c=el('button','st-cell'+(S.fvBg&&S.fvBg.id===sc.id?' sel':''));c.dataset.id=sc.id;
      c.innerHTML='<img alt="'+esc(sc.nom)+'" src="'+sc.thumb+'"><div class="nom">'+esc(sc.nom)+'</div>';
      c.onclick=()=>choisirFond({id:sc.id,src:sc.cv});g.appendChild(c);
    });
    (S.serveur||[]).forEach(f=>{
      const c=el('button','st-cell'+(S.fvBg&&S.fvBg.id===f.id?' sel':''));c.dataset.id=f.id;
      c.innerHTML='<img alt="" src="'+f.url+'"><div class="nom">'+esc(f.nom)+'</div>';
      c.onclick=()=>choisirFond({id:f.id,src:f.el});g.appendChild(c);
    });
    ajouterScenesServeur();
  }else{
    const plus=el('button','st-cell ajout',IC.plus+'<span>Ajouter</span>');plus.onclick=()=>fileIn.click();
    g.appendChild(aucun);g.appendChild(plus);
    if(!S.pellicule.length){
      const v=el('div','st-vide',IC.imgs+'Choisissez des photos ou vidéos de votre pellicule pour les utiliser comme arrière-plan.<br><button type="button">Ouvrir la pellicule</button>');
      v.querySelector('button').onclick=()=>fileIn.click();g.appendChild(v);
    }
    S.pellicule.forEach(it=>{
      const c=el('button','st-cell'+(S.fvBg&&S.fvBg.id===it.id?' sel':''));c.dataset.id=it.id;
      c.innerHTML=it.video?'<video muted playsinline preload="metadata" src="'+it.url+'#t=0.1"></video>':'<img alt="" src="'+it.url+'">';
      c.onclick=()=>choisirFond({id:it.id,src:it.el});g.appendChild(c);
    });
  }
}
function ajouterScenesServeur(){
  if(S.serveurCharge)return;S.serveurCharge=true;S.serveur=[];
  try{
    fetch('/api/reels/fonds-vert',{credentials:'same-origin'}).then(r=>r.json()).then(d=>{
      (d.fonds||[]).forEach(f=>{
        const im=new Image();im.crossOrigin='anonymous';
        im.onload=()=>{S.serveur.push({id:'srv-'+f.id,nom:f.nom,url:f.url,el:im});if(S.fv&&S.tabFV==='scenes')construireFV()};
        im.src=f.url;
      });
    }).catch(()=>{});
  }catch(e){}
}
function choisirFond(item){
  S.fvBg=item;
  R.fvgrid.querySelectorAll('.st-cell').forEach(c=>c.classList.remove('sel'));
  if(!item){const a=R.fvgrid.querySelector('.st-cell:not([data-id]):not(.ajout)');if(a)a.classList.add('sel');majPanneaux();return}
  const c=R.fvgrid.querySelector('.st-cell[data-id="'+item.id+'"]');if(c)c.classList.add('sel');
  if(item.src&&item.src.tagName==='VIDEO'){item.src.play&&item.src.play().catch(()=>{})}
  S.maskReady=false;
  toast('Chargement du fond vert…');
  setTimeout(()=>{if(S.fv&&S.fvBg===item)fermerFV()},250);
  chargerSeg().then(()=>{if(S.fvBg===item)toast('Fond appliqué')}).catch(()=>{
    toast('Fond vert indisponible (connexion ?)');S.fvBg=null;construireFV();majPanneaux();
  });
  majPanneaux();
}
function chargerSeg(){
  if(S.seg)return Promise.resolve(S.seg);
  if(S.segLoading)return S.segLoading;
  const base='https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/';
  S.segLoading=new Promise((ok,ko)=>{
    if(window.SelfieSegmentation){ok();return}
    const s=document.createElement('script');s.src=base+'selfie_segmentation.js';s.crossOrigin='anonymous';
    s.onload=ok;s.onerror=()=>ko(new Error('chargement'));document.head.appendChild(s);
  }).then(()=>{
    const seg=new window.SelfieSegmentation({locateFile:f=>base+f});
    seg.setOptions({modelSelection:1,selfieMode:false});seg.onResults(surResultatSeg);
    return (seg.initialize?seg.initialize():Promise.resolve()).then(()=>{S.seg=seg;return seg});
  }).catch(e=>{S.segLoading=null;throw e});
  return S.segLoading;
}
function flipActif(){return S.facing==='user'&&S.mirror}
function surResultatSeg(r){
  const m=r&&r.segmentationMask;if(!m)return;
  const c=maskCv.getContext('2d');c.clearRect(0,0,W,H);c.save();
  if(flipActif()){c.translate(W,0);c.scale(-1,1)}
  const d=dimsSrc(m);couvre(c,m,d[0],d[1],W,H);c.restore();S.maskReady=true;
}

/* ═══════ CAMÉRA ═══════ */
function arreterCamera(){
  S.camTok=(S.camTok||0)+1; /* annule toute demande de caméra encore en attente */
  if(S.stream){S.stream.getTracks().forEach(t=>{try{t.onended=null;t.stop()}catch(e){}});S.stream=null}
  if(vid){try{vid.pause()}catch(e){}try{vid.srcObject=null}catch(e){}}
  S.torch=false;if(R.flash)R.flash.classList.remove('on');
}
function demarrerCamera(){
  arreterCamera();msg(null);
  const tok=S.camTok;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg('La caméra n’est pas disponible sur ce navigateur (connexion sécurisée https requise).',false);return Promise.resolve(false)}
  const video={facingMode:S.facing,width:{ideal:LITE?960:1280},height:{ideal:LITE?540:720}};
  const audioPropre={echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1};
  const gum=c=>navigator.mediaDevices.getUserMedia(c);
  return gum({video:video,audio:audioPropre})
    .catch(()=>gum({video:video,audio:true}))
    .catch(()=>gum({video:{facingMode:S.facing},audio:false}))
    .then(flux=>{
      /* si entre-temps la caméra a été fermée ou relancée, on libère ce flux (aucune caméra « fantôme ») */
      if(!S.ouvert||tok!==S.camTok){flux.getTracks().forEach(t=>t.stop());return false}
      S.stream=flux;vid.srcObject=flux;S.maskReady=false;
      const vt=flux.getVideoTracks()[0];
      if(vt)vt.onended=()=>{if(S.ouvert&&tok===S.camTok&&!S.rec){msg('La caméra s’est arrêtée.',true)}};
      return vid.play().catch(()=>{}).then(()=>true);
    })
    .catch(()=>{if(tok===S.camTok)msg('Impossible d’accéder à la caméra. Autorisez la caméra et le micro dans les réglages du navigateur.',true);return false});
}
function basculerFlash(){
  const t=S.stream&&S.stream.getVideoTracks()[0];
  const cap=t&&t.getCapabilities?t.getCapabilities():{};
  if(!cap.torch){toast(S.facing==='user'?'Flash : utilisez la caméra arrière':'Flash indisponible');return}
  S.torch=!S.torch;
  t.applyConstraints({advanced:[{torch:S.torch}]}).then(()=>R.flash.classList.toggle('on',S.torch)).catch(()=>{S.torch=false;toast('Flash indisponible')});
}

/* ═══════ BOUCLE DE RENDU ═══════ */
function boucle(t){
  if(!S.ouvert)return;
  S.raf=requestAnimationFrame(boucle);
  if(t-S.lastT<(S.fvBg?36:30))return;
  const dt=Math.min((t-S.lastT)/1000,.1);S.lastT=t;
  try{rendre(((t-S.t0)/1000)%600,dt);S.errRend=0}
  catch(e){console.warn('[studio] rendu',e);S.errRend=(S.errRend||0)+1;if(S.errRend>=4&&S.gl){console.warn('[studio] retour au rendu simple');S.gl=null;S.errRend=0}}
}
function rendre(time,dt){
  const v=vid,pret=v&&v.readyState>=2&&v.videoWidth>0;
  const e=S.effet,fx=e?e.fx:FX_AUCUN,flip=flipActif();
  octx.globalAlpha=1;octx.globalCompositeOperation='source-over';
  if(!pret){octx.fillStyle='#000';octx.fillRect(0,0,W,H)}
  else{
    if(e&&(e.face||e.bulge)){detecterVisage(v);majLisse(dt);calcBulge(e,time)}else S.bul.s=0;
    let src;
    if(S.gl&&rendreGL(v,fx,time,flip))src=S.gl.c;
    else{const c=cam2d.getContext('2d');c.save();if(flip){c.translate(W,0);c.scale(-1,1)}couvre(c,v,v.videoWidth,v.videoHeight,W,H);c.restore();src=cam2d}
    const bg=S.fvBg;
    if(bg&&S.maskReady){
      const d=dimsSrc(bg.src);couvre(octx,bg.src,d[0],d[1],W,H);
      pctx2.globalCompositeOperation='source-over';pctx2.clearRect(0,0,W,H);pctx2.drawImage(src,0,0,W,H);
      pctx2.globalCompositeOperation='destination-in';pctx2.drawImage(maskCv,0,0);pctx2.globalCompositeOperation='source-over';
      octx.drawImage(pcan,0,0);
    }else octx.drawImage(src,0,0,W,H);
    if(bg&&S.seg)envoyerSeg(v);
  }
  animer(octx,dt,time);
  if(e&&e.face)dessinerVisage(octx,e,time);
  if(e&&e.ov)surcouche(octx,e.ov,time);
}

/* ═══════ ENREGISTREMENT ═══════ */
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function choisirMime(){
  const l=['video/webm;codecs=vp8,opus','video/webm','video/mp4','video/webm;codecs=vp9,opus']; /* vp8 d'abord : bien plus léger à encoder que vp9 */
  if(!window.MediaRecorder||!MediaRecorder.isTypeSupported)return '';
  for(let i=0;i<l.length;i++){if(MediaRecorder.isTypeSupported(l[i]))return l[i]}return '';
}
function basculerRec(){
  if(S.rec){arreterRec(false);return}
  if(!S.stream){toast('Caméra non prête');return}
  if(S.timer>0){compteARebours(S.timer);return}
  demarrerRec();
}
function compteARebours(n){
  const c=R.count;R.pop.classList.remove('on');
  let k=n;c.textContent=k;c.classList.add('on');
  S.cdT=setInterval(()=>{k--;if(k<=0){clearInterval(S.cdT);S.cdT=null;c.classList.remove('on');demarrerRec()}else c.textContent=k},1000);
}
function onRecClick(){
  if(S.cdT){clearInterval(S.cdT);S.cdT=null;R.count.classList.remove('on');return}
  basculerRec();
}
function demarrerRec(){
  if(S.rec||!S.stream)return;
  try{if(typeof musiqueChoisie!=='undefined'&&musiqueChoisie&&typeof prepararMusiqueEnDirect==='function')prepararMusiqueEnDirect()}catch(e){}
  try{if(typeof contexteAudioMixage!=='undefined'&&contexteAudioMixage&&contexteAudioMixage.resume)contexteAudioMixage.resume()}catch(e){}
  const flux=out.captureStream(30);
  const mic=S.stream.getAudioTracks()[0];
  let pistes=mic?[mic]:[];
  try{if(typeof obtenirPistesAudioPourEnregistrement==='function')pistes=obtenirPistesAudioPourEnregistrement(mic)||pistes}catch(e){}
  const final=new MediaStream(flux.getVideoTracks().concat(pistes));
  const mime=choisirMime();let rec;
  const opts={videoBitsPerSecond:LITE?2000000:3500000,audioBitsPerSecond:128000};if(mime)opts.mimeType=mime;
  try{rec=new MediaRecorder(final,opts)}catch(e){try{rec=mime?new MediaRecorder(final,{mimeType:mime}):new MediaRecorder(final)}catch(e2){toast('Enregistrement non pris en charge');return}}
  S.chunks=[];S.discard=false;S.recSecs=0;S.paused=false;S.recMime=rec.mimeType||mime||'video/webm';
  rec.ondataavailable=ev=>{if(ev.data&&ev.data.size)S.chunks.push(ev.data)};
  rec.onstop=()=>surFinRec();
  rec.start(250);S.rec=rec;
  root.classList.add('enreg');R.pause.classList.add('on');R.pause.innerHTML=IC.pause;R.timer.classList.add('on');R['timer-t'].textContent='00:00';
  R.rec.innerHTML='<span class="st-sq"></span>';R.pop.classList.remove('on');S.panneau=null;majPanneaux();
  S.recT=setInterval(()=>{
    if(S.paused)return;S.recSecs++;R['timer-t'].textContent=fmt(S.recSecs);
    R.ring.style.setProperty('--p',(S.recSecs/maxSecs()*100)+'%');
    if(S.recSecs>=maxSecs())arreterRec(false);
  },1000);
}
function pauseRec(){
  if(!S.rec)return;
  if(S.paused){try{S.rec.resume()}catch(e){}try{if(typeof audioMusiqueLive!=='undefined'&&audioMusiqueLive)audioMusiqueLive.play()}catch(e){}S.paused=false;R.pause.innerHTML=IC.pause}
  else{try{S.rec.pause()}catch(e){}try{if(typeof audioMusiqueLive!=='undefined'&&audioMusiqueLive)audioMusiqueLive.pause()}catch(e){}S.paused=true;R.pause.innerHTML=IC.play}
}
function arreterRec(discard){
  if(!S.rec)return;
  S.discard=!!discard;clearInterval(S.recT);S.recT=null;
  try{if(S.rec.state!=='inactive')S.rec.stop();else surFinRec()}catch(e){surFinRec()}
}
function remettreUIRec(){
  root.classList.remove('enreg');R.pause.classList.remove('on');R.timer.classList.remove('on');R.rec.innerHTML=IC.reel;R.ring.style.removeProperty('--p');
}
function surFinRec(){
  const dur=S.recSecs,discard=S.discard,mime=S.recMime;
  S.rec=null;remettreUIRec();
  try{if(typeof arreterAudioMusiqueLive==='function')arreterAudioMusiqueLive()}catch(e){}
  if(discard||!S.chunks.length){S.chunks=[];return}
  let blob=new Blob(S.chunks,{type:mime});S.chunks=[];
  const vitesse=S.speed;
  const fin=b=>{
    reelBlobFinal=b;
    const url=URL.createObjectURL(b);
    fermer();
    ouvrirApercu(url,'camera');
  };
  if(vitesse===1){fin(blob);return}
  appliquerVitesse(blob,vitesse,dur,mime).then(b=>fin(b||blob));
}

/* Vitesse : relit la vidéo à la vitesse choisie et l'enregistre à nouveau */
function appliquerVitesse(blob,r,dur,mime){
  return new Promise(resolve=>{
    const ov=document.getElementById('rr-overlay'),tx=document.getElementById('rr-overlay-texte');
    if(tx)tx.textContent='Application de la vitesse '+r+'x…';if(ov)ov.classList.add('actif');
    const fini=b=>{if(ov)ov.classList.remove('actif');resolve(b)};
    const v=document.createElement('video');v.playsInline=true;v.preload='auto';v.src=URL.createObjectURL(blob);v.style.cssText='position:fixed;left:-9999px;width:2px;height:2px;opacity:0';document.body.appendChild(v);
    const nettoie=()=>{try{v.pause()}catch(e){}v.remove()};
    let ac=null,done=false;
    const stopAll=b=>{if(done)return;done=true;clearTimeout(garde);nettoie();try{ac&&ac.close()}catch(e){}fini(b)};
    const garde=setTimeout(()=>stopAll(null),(dur/r+8)*1000);
    v.onerror=()=>stopAll(null);
    v.onloadedmetadata=()=>{
      try{
        const c=document.createElement('canvas');c.width=v.videoWidth||W;c.height=v.videoHeight||H;const cx=c.getContext('2d');
        const AC=window.AudioContext||window.webkitAudioContext;ac=new AC();
        const srcA=ac.createMediaElementSource(v);const dest=ac.createMediaStreamDestination();srcA.connect(dest);
        const flux=new MediaStream(c.captureStream(30).getVideoTracks().concat(dest.stream.getAudioTracks()));
        const rec=mime?new MediaRecorder(flux,{mimeType:mime}):new MediaRecorder(flux);const ch=[];
        rec.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data)};
        rec.onstop=()=>stopAll(ch.length?new Blob(ch,{type:mime||'video/webm'}):null);
        v.playbackRate=r;v.preservesPitch=true;v.mozPreservesPitch=true;v.webkitPreservesPitch=true;
        const dessine=()=>{if(done)return;if(v.readyState>=2)cx.drawImage(v,0,0,c.width,c.height);if(!v.ended)requestAnimationFrame(dessine)};
        v.onended=()=>{try{rec.stop()}catch(e){stopAll(null)}};
        ac.resume&&ac.resume();rec.start(250);
        v.play().then(dessine).catch(()=>stopAll(null));
      }catch(e){stopAll(null)}
    };
  });
}

/* ═══════ OUVERTURE / FERMETURE ═══════ */
function majMusiqueLabel(){
  let t='Ajouter de la musique';
  try{if(typeof musiqueChoisie!=='undefined'&&musiqueChoisie&&musiqueChoisie.title)t='♪ '+musiqueChoisie.title}catch(e){}
  R['lab-musique'].textContent=t;
}
function ouvrir(mode){
  construire();
  if(S.ouvert){if(mode==='effets'){S.panneau='effets';if(S.fvBg)effacerFondVert();majPanneaux()}else if(mode==='fondvert')ouvrirFV();return}
  effacerFondVert(); /* nouvelle ouverture : caméra normale, sans ancien fond vert */
  S.ouvert=true;root.classList.add('ouvert');document.body.classList.add('rr-studio-ouvert');
  try{entrerPleinEcran()}catch(e){}
  S.panneau=null;S.fv=false;root.classList.remove('fv');R.fvsheet.classList.remove('on');R.fxsheet.classList.remove('on');R.bd.classList.remove('on');
  layout();majPanneaux();majMusiqueLabel();
  demarrerCamera();
  S.lastT=0;S.raf=requestAnimationFrame(boucle);
  S.panneau='effets';majPanneaux(); /* bande d'effets ouverte : l'effet choisi est sur le bouton */
}
function fermer(){
  if(!S.ouvert)return;
  if(S.cdT){clearInterval(S.cdT);S.cdT=null;R.count.classList.remove('on')}
  if(S.rec){S.discard=true;clearInterval(S.recT);try{if(S.rec.state!=='inactive')S.rec.stop()}catch(e){}S.rec=null;remettreUIRec()}
  S.ouvert=false;cancelAnimationFrame(S.raf);
  effacerFondVert();
  arreterCamera();
  try{if(typeof arreterAudioMusiqueLive==='function')arreterAudioMusiqueLive()}catch(e){}
  root.classList.remove('ouvert','fv','enreg');document.body.classList.remove('rr-studio-ouvert');
  R.pop.classList.remove('on');
}

/* ═══════ BRANCHEMENT DES BOUTONS ═══════ */
function branche(){
  $('#st-close',root).onclick=()=>{
    if(typeof rrBackArrowClick==='function')rrBackArrowClick();else changerOnglet('galerie');
  };
  R.flash.onclick=basculerFlash;

  R.stage.addEventListener('click',e=>{if(R.pop.classList.contains('on')&&!R.pop.contains(e.target)&&e.target.id!=='st-more')R.pop.classList.remove('on')});
  $('#st-seg-timer',root).querySelectorAll('button').forEach(b=>b.onclick=()=>{S.timer=+b.dataset.v;$('#st-seg-timer',root).querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b))});
  const swG=$('#st-sw-grille',root),swM=$('#st-sw-miroir',root);
  swG.onclick=()=>{S.grille=!S.grille;swG.classList.toggle('on',S.grille);R.grid.classList.toggle('on',S.grille)};
  swM.onclick=()=>{S.mirror=!S.mirror;swM.classList.toggle('on',S.mirror);S.maskReady=false};
  R.menu.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==='musique')changerOnglet('musique');

    else if(a==='effets')basculerPanneau('effets');

  });
  R.plus.onclick=ouvrirFX;
  R.rec.addEventListener('click',onRecClick);
  R.pause.onclick=pauseRec;
  $('#st-gal',root).onclick=()=>{changerOnglet('galerie');const i=document.getElementById('galerie-input');if(i)i.click()};
  const flip=()=>{if(S.rec)return;S.facing=S.facing==='user'?'environment':'user';demarrerCamera()};
  $('#st-flip',root).onclick=flip;$('#st-fv-flip',root).onclick=flip;
  R['msg-b'].onclick=()=>demarrerCamera();
  R.bd.onclick=()=>{if(R.fxsheet.classList.contains('on'))fermerFX()};
  $('#st-fv-annuler',root).onclick=()=>{S.fvBg=S.fvBgPrev;fermerFV()};
  $('#st-fv-ok',root).onclick=fermerFV;
  R.fvsheet.querySelectorAll('.st-tabs button').forEach(b=>b.onclick=()=>{
    S.tabFV=b.dataset.t;construireFV();
    if(S.tabFV==='pellicule'&&!S.pellicule.length)fileIn.click();
  });
  fileIn.onchange=()=>{
    const fs=Array.from(fileIn.files||[]).slice(0,60);
    fs.forEach(f=>{
      const url=URL.createObjectURL(f),id='p'+Date.now()+Math.floor(Math.random()*1e4);
      if(f.type.indexOf('video')===0){
        const v=document.createElement('video');v.src=url;v.loop=true;v.muted=true;v.playsInline=true;v.preload='auto';
        v.onloadeddata=()=>{S.pellicule.push({id:id,url:url,el:v,video:true});if(S.fv&&S.tabFV==='pellicule')construireFV()};
      }else{
        const im=new Image();
        im.onload=()=>{S.pellicule.push({id:id,url:url,el:im,video:false});if(S.fv&&S.tabFV==='pellicule')construireFV()};
        im.src=url;
      }
    });
    fileIn.value='';
  };
}

/* ═══════ BRANCHEMENT SUR LE RESTE DE LA PAGE (sans rien casser) ═══════ */
const origChanger=window.changerOnglet;
window.changerOnglet=function(nom){
  if(nom==='camera'||nom==='effets'||nom==='fondvert'){
    /* nettoyage identique à l'original, sans lancer l'ancienne caméra simple */
    try{sortirPleinEcran()}catch(e){}
    document.querySelectorAll('.rr-tab').forEach(b=>b.classList.toggle('active',b.dataset.onglet===nom));
    document.querySelectorAll('.rr-view').forEach(v=>v.classList.remove('actif'));
    ['vue-review','vue-apercu'].forEach(id=>{const n=document.getElementById(id);if(n)n.classList.remove('actif')});

};
['ouvrirReview','ouvrirApercu'].forEach(n=>{

/* Expose pour les tests / réutilisation */

})();

<script id="rr-studio-ext-js">
(function(){
'use strict';
function versMusique(s){
  const url=s.preview||s.preview_url||s.previewUrl||s.audio_url||s.video_url||'';
  return {title:s.original?'Son original':(s.titre||s.title||'Son'),artist:s.artiste||s.artist||'',artwork:s.cover||'',previewUrl:url,preview_url:url};
}
function ouvrirAvecSon(){
  if(typeof changerOnglet!=='function')return;
  const params=new URLSearchParams(location.search),idSon=params.get('son');
  let s=null;
  try{s=JSON.parse(sessionStorage.getItem('fnReelSon')||'null')}catch(e){}
  try{sessionStorage.removeItem('fnReelSon')}catch(e){}
  if(!idSon&&!s)return;
  const lancer=function(data){
    try{if(data&&typeof rrDefinirMusique==='function')rrDefinirMusique(versMusique(data))}catch(e){}
    changerOnglet('camera');
    try{params.delete('son');history.replaceState(null,'',location.pathname+(params.toString()?'?'+params:''))}catch(e){}
  };
  if(s&&(!idSon||String(s.source_pub_id)===String(idSon))){lancer(s);return}
  fetch('/api/reel/'+encodeURIComponent(idSon)+'/son',{credentials:'same-origin',headers:{'X-Requested-With':'XMLHttpRequest'}})
    .then(function(r){return r.json()}).then(function(d){lancer(d&&d.success!==false?d:null)}).catch(function(){lancer(null)});
}
ouvrirAvecSon();

let strip=null,spacer=null,raf=0,verrou=0;
const SLOT=4;
function E(){return window.rrStudio&&window.rrStudio.etat}
function items(){return strip?Array.prototype.slice.call(strip.querySelectorAll('.st-th')):[]}
function verrouiller(ms){verrou=Date.now()+(ms||1000)}
function plusProche(){
  let best=null,bd=1e9;
  const c=strip.scrollLeft+strip.clientWidth/2;
  items().forEach(function(t){const d=Math.abs(t.offsetLeft+t.offsetWidth/2-c);if(d<bd){bd=d;best=t}});
  return best;
}
function animer(nouveau,ancien,dir){
  if(navigator.vibrate){try{navigator.vibrate(12)}catch(e){}}
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  [nouveau,ancien].forEach(function(n){if(n)n.classList.remove('st-pop','st-sort-g','st-sort-d')});
  void nouveau.offsetWidth;
  nouveau.classList.add('st-pop');
  setTimeout(function(){nouveau.classList.remove('st-pop');if(ancien)ancien.classList.remove('st-sort-g','st-sort-d')},450);
}
function surDefilement(){
  if(raf)return;
  raf=requestAnimationFrame(function(){
    raf=0;
    if(!strip||Date.now()<verrou||!strip.classList.contains('on'))return;
    const cible=plusProche();
    if(!cible||cible.classList.contains('sel'))return;
    const st=E(),prec=strip.querySelector('.st-th.sel'),l=items();
    const dir=prec?(l.indexOf(cible)>l.indexOf(prec)?-1:1):-1;
    if(st)st.noAutoScroll=true;
    try{cible.click()}finally{if(st)st.noAutoScroll=false}
    animer(cible,prec,dir);
  });
}
function ajuster(){
  if(!strip)return;
  if(!strip.querySelector('.st-spacer')){
    const a=document.createElement('div'),b=document.createElement('div');
    a.className=b.className='st-spacer';a.setAttribute('aria-hidden','true');b.setAttribute('aria-hidden','true');
    strip.insertBefore(a,strip.firstChild);strip.appendChild(b);
  }
}
function brancher(){
  const s=document.getElementById('st-strip');
  if(!s)return false;
  if(s===strip)return true;
  strip=s;
  strip.addEventListener('scroll',surDefilement,{passive:true});
  /* un appui sur l'effet placé sur le bouton lance (ou arrête) la vidéo ; un appui sur un autre effet le choisit */
  strip.addEventListener('click',function(e){
    const th=e.target.closest&&e.target.closest('.st-th');
    if(!th||!e.isTrusted||!th.classList.contains('sel'))return;
    e.stopPropagation();e.preventDefault();
    const r=document.getElementById('st-rec');if(r)r.click();
  },true);
  ['st-strip','st-fxsheet','st-menu'].forEach(function(id){
    const n=document.getElementById(id);
    if(n)n.addEventListener('click',function(e){if(e.isTrusted)verrouiller(1000)},true);
  });
  if('ResizeObserver' in window)new ResizeObserver(ajuster).observe(strip);
  ajuster();
  return true;
}
const t=setInterval(function(){if(brancher())clearInterval(t)},300);

document.addEventListener('click',function(e){
  const r=document.getElementById('rr-studio');
  if(!r||!e.target.closest||!e.target.closest('#st-btn-fv,.st-cell,#st-fv-ok,#st-fv-annuler'))return;
  r.classList.add('st-anim');
  clearTimeout(r._stAnimT);
  r._stAnimT=setTimeout(function(){r.classList.remove('st-anim')},900);
},true);
})();
</script>

<!-- ═══ STABILITÉ : coupe tous les sons, protège la caméra ═══ -->
<script id="rr-stabilite-js">
(function(){
'use strict';
function pauseVideo(v){if(!v)return;try{v.pause();v.muted=true}catch(e){}}
function coupeSons(){
  try{if(typeof arreterAudioMusiqueLive==='function')arreterAudioMusiqueLive()}catch(e){}
  pauseVideo(document.getElementById('apercu-video'));
  document.querySelectorAll('#vue-review video,#galerie-grid video').forEach(pauseVideo);
}
/* L'aperçu n'est plus affiché → sa vidéo (avec le son) s'arrête, quoi qu'il arrive */
function surveiller(id,cb){
  const n=document.getElementById(id);if(!n||!window.MutationObserver)return;
  new MutationObserver(function(){if(!n.classList.contains('actif'))cb()}).observe(n,{attributes:true,attributeFilter:['class']});
}
surveiller('vue-apercu',function(){pauseVideo(document.getElementById('apercu-video'))});
surveiller('vue-review',function(){document.querySelectorAll('#vue-review video').forEach(pauseVideo)});

/* Annuler la publication : plus aucun son, la musique choisie est oubliée */
const oMod=window.rrModalAction;
if(typeof oMod==='function')window.rrModalAction=function(action){
  const r=oMod.apply(this,arguments);
  if(action==='annuler'){
    coupeSons();
    try{musiqueChoisie=null;if(typeof rafraichirChipMusique==='function')rafraichirChipMusique()}catch(e){}
  }
  return r;
};
const oRep=window.reprendreDepuisApercu;
if(typeof oRep==='function')window.reprendreDepuisApercu=function(){pauseVideo(document.getElementById('apercu-video'));return oRep.apply(this,arguments)};

/* Quitter vraiment la page : tout est coupé (caméra, micro, musique) */
window.addEventListener('pagehide',function(e){if(!e.persisted){coupeSons();try{if(window.rrStudio)window.rrStudio.fermer()}catch(err){}}});

/* Retour sur la page : si la caméra s'est arrêtée pendant ce temps, on la relance (jamais pendant une demande en cours) */
document.addEventListener('visibilitychange',function(){
  const st=window.rrStudio&&window.rrStudio.etat;if(!st||!st.ouvert||st.rec)return;
  if(document.hidden)return;
  const pistes=st.stream?st.stream.getVideoTracks():[];
  if(pistes.length&&pistes[0].readyState==='ended'){try{window.rrStudio.demarrerCamera()}catch(e){}}
});

/* Surveillant anti-blocage : si l'image de la caméra ne bouge plus pendant 2,5 s, on la répare toute seule */
(function(){
  let dernier=-1,depuis=Date.now(),essais=0;
  setInterval(function(){
    const st=window.rrStudio&&window.rrStudio.etat;
    if(!st||!st.ouvert||document.hidden||!st.stream||!st.video){dernier=-1;depuis=Date.now();essais=0;return}
    const v=st.video,ct=v.currentTime;
    if(ct!==dernier){dernier=ct;depuis=Date.now();essais=0;return}
    if(Date.now()-depuis<2500)return;
    depuis=Date.now();essais++;
    try{
      if(essais===1||st.rec){v.srcObject=st.stream;const p=v.play();if(p&&p.catch)p.catch(function(){})}
      else if(essais<=3){window.rrStudio.demarrerCamera()}
    }catch(e){}
  },1000);
})();
})();
</script>
