{% extends "base.html" %}

{% block content %}
<!-- DÉBUT : Administration d'un groupe -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/groupes.css') }}">
<div class="gp-wrap" id="gpRoot">
    <a href="{{ url_for('groupes_pro.page', gid=gid) }}" class="gp-back"><i class="fas fa-chevron-left"></i> {{ nom }}</a>
    <h1 class="gp-admin-title">Administration du groupe</h1>
    <nav class="gp-tabs gp-tabs-scroll" id="gpTabs" role="tablist" aria-label="Sections d'administration">
        <button type="button" role="tab" data-tab="demandes" class="active">Demandes <span class="gp-count" data-cnt="demandes" hidden></span></button>
        <button type="button" role="tab" data-tab="a_valider">À valider <span class="gp-count" data-cnt="a_valider" hidden></span></button>
        <button type="button" role="tab" data-tab="signalements">Signalements <span class="gp-count" data-cnt="signalements" hidden></span></button>
        <button type="button" role="tab" data-tab="membres">Membres</button>
        <button type="button" role="tab" data-tab="bannis">Bannis</button>
        {% if est_admin %}
        <button type="button" role="tab" data-tab="reglages">Réglages</button>
        <button type="button" role="tab" data-tab="regles">Règles et questions</button>
        <button type="button" role="tab" data-tab="stats">Statistiques</button>
        <button type="button" role="tab" data-tab="journal">Journal</button>
        {% endif %}
    </nav>
    <div id="gpBody" aria-live="polite"></div>
</div>
<div id="gpModalRoot"></div>
<div id="gpToast" class="gp-toast" role="status" aria-live="polite"></div>
<script>window.GP = { page: 'gerer', gid: {{ gid }}, admin: {{ 'true' if est_admin else 'false' }}, moi: {{ session.get('user_id') | tojson }}, categories: {{ categories | tojson }} };</script>
<script src="{{ url_for('static', filename='js/groupes.js') }}"></script>
<!-- FIN : Administration d'un groupe -->
{% endblock %}
