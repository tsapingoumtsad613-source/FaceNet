<style id="reel-reactions-css">
/* ── RÉACTIONS AU MAINTIEN DU BOUTON J'AIME (même rendu que feed.html) ── */
.reel-circle-btn[onclick^="toggleLike("] { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; position: relative; }
.rr-popup {
    position: fixed; display: flex; align-items: flex-end; gap: 2px; padding: 10px 12px; border-radius: 46px;
    background: linear-gradient(180deg, #ffffff 0%, #edf1f7 100%);
    border: 1px solid rgba(15, 23, 42, .06);
    box-shadow: 0 16px 36px rgba(0, 0, 0, .45), 0 3px 8px rgba(0, 0, 0, .25), inset 0 1px 0 #fff;
    z-index: 4300; transform: translateY(12px) scale(.82); transform-origin: 100% 100%;
    opacity: 0; pointer-events: none; transition: transform .16s ease, opacity .16s ease;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none;
}
.rr-popup.show { transform: translateY(0) scale(1); opacity: 1; pointer-events: auto; }
.rr-popup button {
    position: relative; width: 40px; height: 40px; padding: 0; margin: 0 1px; border: none; background: none;
    cursor: pointer; font-size: 0; line-height: 0; transform-origin: 50% 100%;
    transition: transform .2s cubic-bezier(.3, 1.7, .5, 1); filter: drop-shadow(0 4px 3px rgba(0, 0, 0, .32));
    -webkit-tap-highlight-color: transparent;
}
.rr-popup.show button { animation: rrRise .5s cubic-bezier(.2, 1.6, .4, 1) backwards; animation-delay: calc(var(--i, 0) * 38ms); }
.rr-popup button:hover, .rr-popup button.hot { transform: translateY(-16px) scale(1.6); z-index: 2; }
.rr-popup.has-hot button:not(.hot) { transform: scale(.9); }
.rr-popup .rr-tip {
    position: absolute; bottom: 100%; left: 50%; transform: translate(-50%, 2px) scale(.62); opacity: 0; pointer-events: none;
    transition: opacity .12s; background: rgba(20, 24, 33, .92); color: #fff; padding: 6px 9px; border-radius: 14px; white-space: nowrap;
    font: 700 11px/1 system-ui, -apple-system, 'Segoe UI', sans-serif;
}
.rr-popup button:hover .rr-tip, .rr-popup button.hot .rr-tip { opacity: 1; }
@keyframes rrRise { from { transform: translateY(34px) scale(.2) rotate(-18deg); opacity: 0; } to { transform: none; opacity: 1; } }
.rr-svg { display: block; width: 100%; height: 100%; }
.rr-fly { position: fixed; z-index: 4400; pointer-events: none; will-change: transform, opacity; filter: drop-shadow(0 8px 8px rgba(0, 0, 0, .35)); }
.rr-btnicon { display: none; width: 28px; height: 28px; }
.reel-circle-btn.rr-has-emoji > i { display: none; }
.reel-circle-btn.rr-has-emoji > .rr-btnicon { display: block; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .35)); }
.rr-btnicon.rr-land { animation: rrLand .45s cubic-bezier(.2, 1.8, .4, 1); }
@keyframes rrLand { 0% { transform: scale(.3) rotate(-20deg); } 60% { transform: scale(1.35) rotate(6deg); } 100% { transform: none; } }
/* Émojis animés dans le menu */
.rr-an .rr-an-face { transform-box: view-box; transform-origin: 32px 34px; }
.rr-an-like .rr-an-face { animation: rrAnLike 1.1s ease-in-out infinite; }
.rr-an-love .rr-an-face { animation: rrAnBeat .9s ease-in-out infinite; }
.rr-an-care .rr-an-face { animation: rrAnBeat 1.2s ease-in-out infinite; }
.rr-an-haha { animation: rrAnWiggle .55s ease-in-out infinite; }
.rr-an-haha .rr-an-face { animation: rrAnLaugh .55s ease-in-out infinite; }
.rr-an-wow .rr-an-face { animation: rrAnWow 1.2s ease-in-out infinite; }
.rr-an-sad .rr-an-face { animation: rrAnSad 1.9s ease-in-out infinite; }
.rr-an-angry { animation: rrAnShake .4s linear infinite; }
@keyframes rrAnLike { 0%, 100% { transform: rotate(0) translateY(0) scale(1); } 28% { transform: rotate(-18deg) translateY(-4px) scale(1.1); } 55% { transform: rotate(5deg) translateY(1px) scale(1); } 75% { transform: rotate(-4deg) translateY(-1px); } }
@keyframes rrAnBeat { 0%, 100% { transform: scale(1); } 22% { transform: scale(1.22); } 42% { transform: scale(.96); } 62% { transform: scale(1.15); } }
@keyframes rrAnWiggle { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
@keyframes rrAnLaugh { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-2.5px) scale(1.05); } }
@keyframes rrAnWow { 0%, 100% { transform: scale(1) translateY(0); } 40% { transform: scale(1.16) translateY(-1px); } 70% { transform: scale(1.04); } }
@keyframes rrAnSad { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(3px) scale(.96); } }
@keyframes rrAnShake { 0%, 100% { transform: translateX(0) rotate(0); } 25% { transform: translateX(-1.6px) rotate(-3deg); } 75% { transform: translateX(1.6px) rotate(3deg); } }
/* Double-tap : l'émoji de ta réaction remplace le pouce */
.reel-heart-burst.rr-burst { width: 80px; height: 80px; font-size: 0; color: transparent; text-shadow: none; filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .45)); }
.reel-thumb-rise.rr-burst { width: var(--rv-size, 44px); height: var(--rv-size, 44px); font-size: 0; color: transparent; text-shadow: none; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .4)); }
@media (prefers-reduced-motion: reduce) {
    .rr-popup.show button, .rr-btnicon.rr-land, .rr-an, .rr-an .rr-an-face { animation: none !important; }
}
</style>

            [{ retard: 0, op: 1 }, { retard: 55, op: .38 }, { retard: 110, op: .2 }].forEach(function (tr, idx) {
                var el = document.createElement('div');
                el.className = 'rr-fly';
                el.style.width = t0 + 'px'; el.style.height = t0 + 'px';
                el.style.left = (sx - t0 / 2) + 'px'; el.style.top = (sy - t0 / 2) + 'px';
                el.innerHTML = icone(type);
                document.body.appendChild(el);
                clones.push(el);
                if (typeof el.animate !== 'function') { terminer(); return; }
                var fin = idx === 0 ? 1 : 0;
                var anim = el.animate([
                    { transform: 'translate(0px, 0px) scale(1) rotate(0deg)', opacity: tr.op },
                    { transform: 'translate(' + (dx * 0.5) + 'px, ' + (dy * 0.5 + levee) + 'px) scale(' + (((1 + k) / 2) * 1.25) + ') rotate(-14deg)', opacity: tr.op, offset: 0.55 },
                    { transform: 'translate(' + dx + 'px, ' + dy + 'px) scale(' + k + ') rotate(0deg)', opacity: fin }
                ], { duration: 460, delay: tr.retard, easing: 'cubic-bezier(.45,.05,.35,1)', fill: 'both' });
                if (idx === 0) anim.onfinish = terminer;
            });
            setTimeout(terminer, 1100);
        });
    }

    function envoyer(pubId, type) {
        return fetch('/api/reaction/' + pubId, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
            body: JSON.stringify({ type: type })
        })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
        .then(function (res) { return (res.ok && res.data && res.data.success) ? res.data : null; })
        .catch(function () { return null; });
    }

    function choisir(type, source) {
        var pubId = popupPubId, btn = popupBtn;
        if (!pubId || !btn) return;
        amorcerAudio();
        var actuel = btn.classList.contains('liked') ? (btn.dataset.reaction || 'like') : '';
        var retire = (actuel === type);
        var depart = source ? source.getBoundingClientRect() : null;
        fermer();
        setTimeout(function () { longPress = false; }, 400);
        var requete = envoyer(pubId, type);
        var vol = retire ? Promise.resolve() : voler(type, depart, btn);
        vol.then(function () {
            if (!retire) { jouerPop(); vibrer([40, 30, 60]); }
            return requete;
        }).then(function (data) {
            if (!data) { if (typeof window.showReelToast === 'function') window.showReelToast("Impossible d'enregistrer la réaction."); return; }
            appliquer(pubId, data, true);
            var count = document.getElementById('like-count-' + pubId);
            if (count) count.innerHTML = '<i class="fa-solid fa-thumbs-up"></i> ' + data.total + " J'aime";
            if (window.reelLibRecord && window.reelLibRemove) {
                if (data.active_type) window.reelLibRecord('liked', pubId); else window.reelLibRemove('liked', pubId);
            }
        });
    }

    /* Glisser le doigt sur le menu : l'emoji survolé grossit, relâcher le choisit */
    function survoler(x, y) {
        if (!popup || !popup.classList.contains('show')) return;
        var el = document.elementFromPoint(x, y);
        var b = (el && el.closest) ? el.closest('.rr-popup button') : null;
        var nouveau = b ? b.dataset.type : null;
        if (nouveau === hotType) return;
        hotType = nouveau;
        popup.querySelectorAll('button').forEach(function (o) { o.classList.toggle('hot', o === b); });
        popup.classList.toggle('has-hot', !!b);
        if (b) vibrer(8);
    }
    document.addEventListener('touchmove', function (e) {
        if (!doigtAppuye || !longPress || !popup || !popup.classList.contains('show')) return;
        var p = e.touches && e.touches[0];
        if (!p) return;
        if (e.cancelable) e.preventDefault();
        survoler(p.clientX, p.clientY);
    }, { passive: false });
    document.addEventListener('mousemove', function (e) {
        if (!longPress || !popup || !popup.classList.contains('show')) return;
        survoler(e.clientX, e.clientY);
    });
    document.addEventListener('touchend', function () {
        if (!longPress || !popup || !popup.classList.contains('show')) return;
        var b = hotType ? popup.querySelector('button.hot') : null;
        if (b) choisir(hotType, b);
    });
    document.addEventListener('mouseup', function () {
        if (!longPress || !popup || !popup.classList.contains('show')) return;
        var b = hotType ? popup.querySelector('button.hot') : null;
        if (b) choisir(hotType, b);
    });

    function demarrer(e, btn) {
        clearTimeout(pressTimer);
        longPress = false;
        doigtAppuye = !!(e.touches && e.touches.length);
        var pt = (e.touches && e.touches[0]) ? e.touches[0] : e;
        startX = pt.clientX; startY = pt.clientY;
        amorcerAudio();
        pressTimer = setTimeout(function () {
            longPress = true;
            var m = (btn.getAttribute('onclick') || '').match(/toggleLike\((\d+)/);
            if (m) ouvrir(btn, m[1]);
        }, 450);
    }
    document.addEventListener('mousedown', function (e) {
        if (e.button !== 0) return;
        var btn = e.target.closest('[onclick^="toggleLike("]');
        if (btn) demarrer(e, btn);
    });
    document.addEventListener('touchstart', function (e) {
        var btn = e.target.closest('[onclick^="toggleLike("]');
        if (btn) demarrer(e, btn);
    }, { passive: true });
    document.addEventListener('touchmove', function (e) {
        if (!pressTimer) return;
        var pt = e.touches && e.touches[0];
        if (!pt) return;
        if (Math.abs(pt.clientX - startX) > SEUIL || Math.abs(pt.clientY - startY) > SEUIL) clearTimeout(pressTimer);
    }, { passive: true });
    ['mouseup', 'touchend', 'touchcancel'].forEach(function (evt) {
        document.addEventListener(evt, function () { clearTimeout(pressTimer); });
    });
    ['touchend', 'touchcancel'].forEach(function (evt) {
        document.addEventListener(evt, function () { doigtAppuye = false; });
    });
    /* Pas de menu contextuel du navigateur sur le bouton J'aime (appui long mobile / clic droit) */
    document.addEventListener('contextmenu', function (e) {
        if (e.target.closest && e.target.closest('[onclick^="toggleLike("]')) e.preventDefault();
    });

    /* Le menu se ferme si on fait défiler les reels sans rien choisir */
    function fermerSiScroll() {
        if (!popup || !popup.classList.contains('show')) return;
        if (doigtAppuye) return;
        if (Date.now() - ouvertLe < 350) return;
        fermer();
    }
    document.addEventListener('scroll', fermerSiScroll, { passive: true, capture: true });
    window.addEventListener('wheel', fermerSiScroll, { passive: true });
    document.addEventListener('touchmove', function (e) {
        if (!popup || !popup.classList.contains('show') || doigtAppuye) return;
        if (e.target && e.target.closest && e.target.closest('.rr-popup')) return;
        fermerSiScroll();
    }, { passive: true });

    /* Après un appui long, le « click » qui suit ne doit pas relancer toggleLike() */
    document.addEventListener('click', function (e) {
        var btn = e.target.closest('[onclick^="toggleLike("]');
        if (btn && longPress) {
            e.stopPropagation();
            e.preventDefault();
            longPress = false;
        }
        if (popup && !e.target.closest('.rr-popup') && !btn) fermer();
    }, true);

    /* ── Double-tap sur la vidéo : si tu as déjà une réaction, son emoji remplace le pouce ── */
    var burstOrig = window.spawnReelLikeBurst;
    if (typeof burstOrig === 'function') {
        window.spawnReelLikeBurst = function (container) {
            burstOrig.apply(this, arguments);
            try {
                var carte = container && container.closest ? container.closest('.reel-fullscreen-card') : null;
                var btn = carte ? carte.querySelector('[id^="like-btn-"]') : null;
                var type = btn && btn.classList.contains('liked') ? btn.dataset.reaction : '';
                if (!type || type === 'like' || !LABELS[type]) return;
                sprite();
                container.querySelectorAll('.reel-heart-burst:not(.rr-burst), .reel-thumb-rise:not(.rr-burst)').forEach(function (el) {
                    el.classList.remove('fa-solid', 'fa-thumbs-up');
                    el.classList.add('rr-burst');
                    el.innerHTML = icone(type);
                });
            } catch (e) {}
        };
    }

    /* Reels chargés par le défilement infini */
    document.addEventListener('DOMContentLoaded', function () { observerBoutons(); });
    if (document.readyState !== 'loading') observerBoutons();
    var conteneur = document.getElementById('reels-container');
    if (conteneur && 'MutationObserver' in window) {
        new MutationObserver(function () { observerBoutons(conteneur); }).observe(conteneur, { childList: true });
    }
})();
</script>
