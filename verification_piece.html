{% extends "base.html" %}

{% block content %}
<style>
    .verification-wrapper {
        max-width: 600px;
        margin: 30px auto;
        padding: 15px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .card-container {
        background: #ffffff;
        padding: 30px 25px;
        border-radius: 20px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        border: 1px solid #e4e6eb;
    }

    /* ILLUSTRATION CARTE D'IDENTITÉ DESSIN / CARTOON */
    .illustration-container {
        display: flex;
        justify-content: center;
        margin-bottom: 25px;
    }

    .cartoon-id-card {
        width: 240px;
        height: 151px;
        background: linear-gradient(135deg, #ffffff 0%, #f0f4f8 100%);
        border: 2px solid #1877f2;
        border-radius: 12px;
        padding: 12px;
        box-shadow: 0 10px 20px rgba(24, 119, 242, 0.15);
        position: relative;
        display: flex;
        gap: 12px;
        align-items: center;
        transform: rotate(-1.5deg);
    }

    /* Silhouette du petit bonhomme sans visage */
    .avatar-frame {
        width: 65px;
        height: 80px;
        background-color: #e2e8f0;
        border: 2px dashed #94a3b8;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .faceless-avatar {
        width: 100%;
        height: 100%;
        fill: #94a3b8;
    }

    .card-details {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .line {
        height: 7px;
        background-color: #cbd5e1;
        border-radius: 4px;
    }
    .line.primary { background-color: #1877f2; width: 85%; }
    .line.medium { width: 65%; }
    .line.short { width: 45%; }

    .badge-certified {
        position: absolute;
        top: -8px;
        right: -8px;
        background: #42b72a;
        color: #fff;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        border: 2px solid #fff;
    }

    /* GRILLE DE SÉLECTION */
    .doc-types-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin: 20px 0;
    }

    .doc-type-card {
        border: 2px solid #e4e6eb;
        border-radius: 12px;
        padding: 15px;
        text-align: center;
        cursor: pointer;
        background-color: #f7f8fa;
        transition: all 0.2s ease;
    }

    .doc-type-card.selected {
        border-color: #1877f2;
        background-color: #e7f3ff;
        color: #1877f2;
    }

    .doc-type-card i {
        font-size: 26px;
        margin-bottom: 8px;
        color: #1877f2;
    }

    .doc-type-card span {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #333;
    }

    .doc-type-card small {
        display: block;
        margin-top: 4px;
        font-size: 11px;
        color: #65676b;
    }

    .btn-action {
        width: 100%;
        margin-top: 15px;
        padding: 16px;
        background: #1877f2;
        color: white;
        border: none;
        border-radius: 12px;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
    }
</style>

<div class="verification-wrapper">
    <div class="card-container">

        <!-- Illustration de la carte avec bonhomme anonyme -->
        <div class="illustration-container">
            <div class="cartoon-id-card">
                <div class="badge-certified">
                    <i class="fa-solid fa-check"></i>
                </div>
                
                <div class="avatar-frame">
                    <svg class="faceless-avatar" viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>

                <div class="card-details">
                    <div class="line primary"></div>
                    <div class="line medium"></div>
                    <div class="line short"></div>
                </div>
            </div>
        </div>

        <h2 style="text-align: center; color: #1c1e21; font-size: 22px; margin: 0;">Type de pièce d'identité</h2>
        <p style="text-align: center; color: #65676b; font-size: 14px; margin-top: 6px;">Choisissez le document officiel que vous souhaitez vérifier.</p>

        <form action="{% if reverif_modif_id %}{{ url_for('main.reverif_scan', modif_id=reverif_modif_id) }}{% else %}{{ url_for('main.verification_etape_scan') }}{% endif %}" method="GET">
            <div class="doc-types-grid">
                <div class="doc-type-card selected" onclick="selectDoc('cni', this)">
                    <i class="fa-solid fa-address-card"></i>
                    <span>Carte d'Identité</span>
                    <small>Recto + verso</small>
                </div>
                <div class="doc-type-card" onclick="selectDoc('passport', this)">
                    <i class="fa-solid fa-passport"></i>
                    <span>Passeport</span>
                    <small>Recto seul</small>
                </div>
                <div class="doc-type-card" onclick="selectDoc('permis', this)">
                    <i class="fa-solid fa-id-badge"></i>
                    <span>Permis de Conduire</span>
                    <small>Recto + verso</small>
                </div>
                <div class="doc-type-card" onclick="selectDoc('sejour', this)">
                    <i class="fa-solid fa-file-contract"></i>
                    <span>Carte de Séjour</span>
                    <small>Recto + verso</small>
                </div>
            </div>

            <input type="hidden" name="type_document" id="type_document" value="cni">

            <button type="submit" class="btn-action">
                Continuer
            </button>
        </form>
    </div>
</div>

<script>
    function selectDoc(type, element) {
        document.getElementById('type_document').value = type;
        document.querySelectorAll('.doc-type-card').forEach(card => card.classList.remove('selected'));
        element.classList.add('selected');
    }
</script>
{% endblock %}
